<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ይስማዉ ቢንጎ Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --gold: #FFD700;
            --green: #00FF66;
            --yellow: #FFFF00;
            --red: #FF0033;
            --radius: 16px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #020608, #091920, #112530);
            min-height: 100vh; 
            color: white; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            margin-top: 50px;
        }

        .active-screen {
            display: flex !important;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        button {
            background: linear-gradient(135deg, #00FF66, #00cc52);
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(0,255,102,0.4);
        }

        /* BINGO BOARD */
        #bingo-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 450px;
            background-color: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            margin: 20px auto;
            box-sizing: border-box;
        }

        .cell {
            background-color: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            color: white;
        }

        .cell:hover {
            border-color: rgba(255, 255, 255, 0.25); 
            background-color: rgba(255, 255, 255, 0.1);
        }

        .cell.marked {
            background: linear-gradient(135deg, #00FF66, #00cc52) !important;
            color: black !important; 
            border-color: var(--green) !important;
            box-shadow: 0 0 14px rgba(0, 255, 102, 0.5);
            animation: pulse 0.3s ease-in-out;
        }

        .cell.free {
            background: linear-gradient(135deg, var(--red), #cc0028); 
            color: white; 
            font-size: 0.75rem; 
            font-weight: 900;
        }

        .cell.free.marked {
            background: linear-gradient(135deg, var(--gold), #ffaa00) !important;
            color: black !important;
            border-color: var(--gold) !important;
            box-shadow: 0 0 14px rgba(255, 215, 0, 0.6);
        }

        #status {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--yellow);
            margin-top: 15px;
            min-height: 30px;
        }

        .won-message {
            color: var(--green) !important;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <h1>🎱 ይስማዉ ቢንጎ Pro 🏆</h1>

    <div id="admin-login-screen" class="screen active-screen">
        <div class="card">
            <h2>🛡️ የአድሚን መቆጣጠሪያ</h2>
            <input type="password" id="adm-pass" placeholder="የአድሚን ፓስወርድ ያስገቡ...">
            <button onclick="adminLogin()">ግባ (Login)</button>
            <p style="margin: 15px 0 5px; color: #aaa;">ወይም ተጫዋች ከሆንክ፦</p>
            <button style="background: #0088ff; color: white;" onclick="showPlayerEntry()">እንደ ተጫዋች ግባ</button>
        </div>
    </div>

    <div id="player-wait-screen" class="screen">
        <div class="card">
            <div id="pw-name-form">
                <h2>👤 መለያ ስምዎን ያስገቡ</h2>
                <input type="text" id="pw-name-inp" placeholder="ሙሉ ስምዎን እዚህ ይፃፉ...">
                <button onclick="playerEnterName()">ካርቴላ አውጣና ጀምር</button>
            </div>

            <div id="pw-waiting" style="display: none;">
                <h3 id="pw-name-shown" style="color: var(--gold);">ስም: </h3>
                <div id="status"></div>
                <div id="bingo-board"></div>
            </div>
        </div>
    </div>

    <script>
        // 1. FIREBASE CONFIGURATION (የራስህን እውነተኛ ቁልፎች ተካባቸው)
        const firebaseConfig = {
            apiKey: "AIzaSyA1...",
            authDomain: "yismaw-bingo.firebaseapp.com",
            databaseURL: "https://yismaw-bingo-default-rtdb.firebaseio.com",
            projectId: "yismaw-bingo",
            storageBucket: "yismaw-bingo.appspot.com",
            messagingSenderId: "12345678",
            appId: "1:123456:web:abcdef"
        };

        // Firebase-ን ማስነሳት
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CONFIG = { ADMIN_PASSWORD: "admin123" };
        const STATE = {
            role: null,
            playerName: "",
            SIZE: 5,
            grid: Array(5).fill(null).map(() => Array(5).fill(false))
        };

        // ገጹ ሲከፈት ዩአርኤል (URL) ላይ ተጫዋች መሆኑን ቼክ ያደርጋል
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');

            if (role === 'player') {
                switchScreen('player-wait-screen');
            }
        });

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(screenId).classList.add('active-screen');
        }

        function showPlayerEntry() {
            switchScreen('player-wait-screen');
        }

        // አድሚን ሲገባ
        function adminLogin() {
            const pass = document.getElementById('adm-pass').value;
            if (pass === CONFIG.ADMIN_PASSWORD) {
                alert("🛡️ እንኳን ደህና መጡ አድሚን! (እዚህ ላይ የአድሚን ገጽ ማሳያ መስራት ትችላለህ)");
            } else {
                alert("❌ የተሳሳተ ፓስወርድ ነው!");
            }
        }

        // ተጫዋቹ ስሙን አስገብቶ ሲጫን
        function playerEnterName() {
            const nameInp = document.getElementById('pw-name-inp').value.trim();
            if (!nameInp) { alert("እባክዎ ስምዎን ያስገቡ!"); return; }

            STATE.playerName = nameInp;
            
            // ወደ Firebase ዳታቤዝ ለመላክ
            const pId = 'p_' + Date.now();
            db.ref('players/' + pId).set({
                id: pId,
                name: nameInp,
                status: 'active'
            });

            // ፎርሙን ደብቆ ቦርዱን ማሳየት
            document.getElementById('pw-name-form').style.display = 'none';
            document.getElementById('pw-waiting').style.display = 'block';
            document.getElementById('pw-name-shown').textContent = '👤 ተጫዋች: ' + nameInp;

            // የቢንጎ ካርቴላውን ማመንጨት
            setupBingoBoard();
        }

        // የቢንጎ 5x5 ቁጥሮችን በህጉ መሰረት ማመንጫ
        function generateBingoNumbers() {
            const ranges = [
                { min: 1, max: 15 },   // B
                { min: 16, max: 30 },  // I
                { min: 31, max: 45 },  // N
                { min: 46, max: 60 },  // G
                { min: 61, max: 75 }   // O
            ];

            let numbers = Array(STATE.SIZE).fill(null).map(() => []);

            for (let col = 0; col < STATE.SIZE; col++) {
                const pool = [];
                for (let i = ranges[col].min; i <= ranges[col].max; i++) {
                    pool.push(i);
                }
                // Shuffle (ቁጥሮቹን መቀላቀል)
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
                numbers[col] = pool.slice(0, STATE.SIZE);
            }
            return numbers;
        }

        // የቢንጎ ካርቴላውን ሰርቶ HTML ላይ መትከል
        function setupBingoBoard() {
            const board = document.getElementById('bingo-board');
            if (!board) return;
            board.innerHTML = '';

            const bingoNumbers = generateBingoNumbers();

            for (let row = 0; row < STATE.SIZE; row++) {
                for (let col = 0; col < STATE.SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');

                    // መሃል ላይ FREE ቦታ ለመስጠት
                    if (row === 2 && col === 2) {
                        cell.textContent = "FREE";
                        cell.classList.add('free', 'marked');
                        STATE.grid[row][col] = true;
                    } else {
                        // ቁጥሮቹን በአምድ (Column) መደርደር
                        cell.textContent = bingoNumbers[col][row];

                        cell.addEventListener('click', () => {
                            if (!cell.classList.contains('marked')) {
                                cell.classList.add('marked');
                                STATE.grid[row][col] = true;
                                checkWin();
                            } else {
                                cell.classList.remove('marked');
                                STATE.grid[row][col] = false;
                                document.getElementById('status').textContent = "";
                                document.getElementById('status').classList.remove('won-message');
                            }
                        });
                    }
                    board.appendChild(cell);
                }
            }
        }

        // የማሸነፊያ ቀመር
        function checkWin() {
            // 1. አግድም (Rows)
            for (let r = 0; r < STATE.SIZE; r++) {
                if (STATE.grid[r].every(val => val)) { return showWin(); }
            }

            // 2. በቁም (Columns)
            for (let c = 0; c < STATE.SIZE; c++) {
                let colWin = true;
                for (let r = 0; r < STATE.SIZE; r++) {
                    if (!STATE.grid[r][c]) { colWin = false; break; }
                }
                if (colWin) { return showWin(); }
            }

            // 3. በሰያፍ (Diagonals)
            let diag1 = true, diag2 = true;
            for (let i = 0; i < STATE.SIZE; i++) {
                if (!STATE.grid[i][i]) diag1 = false;
                if (!STATE.grid[i][STATE.SIZE - 1 - i]) diag2 = false;
            }
            if (diag1 || diag2) { return showWin(); }
        }

        function showWin() {
            const statusText = document.getElementById('status');
            statusText.textContent = "🎉 ቢንጎ! አሸንፈሃል! 🏆";
            statusText.classList.add('won-message');
        }
    </script>
</body>
</html>
